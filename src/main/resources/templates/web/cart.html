<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/web-layout :: head('Shopping Cart')}"></head>
<body>
    <header th:replace="~{fragments/web-layout :: navbar}"></header>

    <main class="container my-5">
        <h2 class="mb-4">Shopping Cart</h2>
        
        <div th:replace="~{fragments/web-layout :: alerts}"></div>
        
        <div th:if="${#lists.isEmpty(cartItems)}" class="text-center py-5">
            <h4 class="text-muted">Your cart is empty.</h4>
            <a th:href="@{/products}" class="btn btn-primary mt-3">Continue Shopping</a>
        </div>
        
        <div class="row" th:unless="${#lists.isEmpty(cartItems)}">
            <div class="col-lg-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col" colspan="2">Product</th>
                                    <th scope="col">Price</th>
                                    <th scope="col">Quantity</th>
                                    <th scope="col">Subtotal</th>
                                    <th scope="col">Action</th>
                                </tr>
                            </thead>
                            <tbody>
                                <tr th:each="item : ${cartItems}">
                                    <td style="width: 80px;">
                                        <img th:src="${item.image}" alt="Product" class="img-fluid rounded" style="max-height: 60px;">
                                    </td>
                                    <td>
                                        <a th:href="@{/products/{id}(id=${item.productId})}" class="text-decoration-none text-dark fw-bold" th:text="${item.productName}">Product Name</a>
                                    </td>
                                    <td th:text="${'$' + item.price}">$0.00</td>
                                    <td>
                                        <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center">
                                            <input type="hidden" name="productId" th:value="${item.productId}">
                                            <input type="number" name="quantity" class="form-control form-control-sm me-2" style="width: 70px;" th:value="${item.quantity}" min="1">
                                            <button type="submit" class="btn btn-sm btn-outline-primary"><i class="bi bi-arrow-clockwise"></i></button>
                                        </form>
                                    </td>
                                    <td class="fw-bold" th:text="${'$' + (item.price * item.quantity)}">$0.00</td>
                                    <td>
                                        <form th:action="@{/cart/remove}" method="post">
                                            <input type="hidden" name="productId" th:value="${item.productId}">
                                            <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                                        </form>
                                    </td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <div class="col-lg-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">Order Summary</h5>
                    </div>
                    <div class="card-body">
                        <div class="d-flex justify-content-between mb-3">
                            <span>Total Items:</span>
                            <span class="fw-bold" th:text="${#aggregates.sum(cartItems.![quantity])}">0</span>
                        </div>
                        <div class="d-flex justify-content-between mb-3 fs-5">
                            <span>Total Amount:</span>
                            <span class="fw-bold text-danger" th:text="${'$' + #aggregates.sum(cartItems.![price * quantity])}">$0.00</span>
                        </div>
                        <hr>
                        <a th:href="@{/checkout}" class="btn btn-success w-100 btn-lg">Proceed to Checkout</a>
                        <a th:href="@{/products}" class="btn btn-outline-secondary w-100 mt-2">Continue Shopping</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/web-layout :: footer}"></footer>
</body>
</html>
