<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/web-layout :: head('Đăng nhập')}"></head>
<body>
    <header th:replace="~{fragments/web-layout :: navbar}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</h4>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${param.error}" class="alert alert-danger py-2">
                            <i class="bi bi-exclamation-circle me-1"></i> Email hoặc mật khẩu không chính xác.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success py-2">
                            <i class="bi bi-check-circle me-1"></i> Bạn đã đăng xuất thành công.
                        </div>
                        <div th:if="${param.registered}" class="alert alert-success py-2">
                            <i class="bi bi-check-circle me-1"></i> Đăng ký thành công! Vui lòng đăng nhập.
                        </div>
                        
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Địa chỉ Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="username" name="username" placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu..." required>
                                </div>
                            </div>
                            <div class="d-grid gap-2 mb-3">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold">Đăng nhập</button>
                            </div>
                        </form>

                        <div class="my-3 d-flex align-items-center">
                            <hr class="flex-grow-1 my-0 text-muted opacity-25">
                            <span class="px-3 text-muted small fw-semibold">HOẶC</span>
                            <hr class="flex-grow-1 my-0 text-muted opacity-25">
                        </div>

                        <!-- Google OAuth2 Button -->
                        <div class="d-grid gap-2">
                            <a th:href="@{/oauth2/authorization/google}" 
                               class="btn btn-outline-secondary py-2.5 d-flex align-items-center justify-content-center gap-2 rounded-3 shadow-xs bg-white text-dark fw-semibold border" 
                               style="transition: all 0.2s ease;">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 48 48">
                                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                                </svg>
                                <span>Đăng nhập bằng Google</span>
                            </a>
                        </div>

                        <div class="mt-4 text-center border-top pt-3">
                            <p class="mb-0 text-muted">Chưa có tài khoản? <a th:href="@{/register}" class="fw-semibold text-primary">Đăng ký ngay</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/web-layout :: footer}"></footer>
</body>
</html>
