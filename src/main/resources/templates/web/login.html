<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/web-layout :: head('Đăng nhập')}"></head>
<body>
    <header th:replace="~{fragments/web-layout :: navbar}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập</h4>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${param.error}" class="alert alert-danger py-2">
                            <i class="bi bi-exclamation-circle me-1"></i> Email hoặc mật khẩu không chính xác.
                        </div>
                        <div th:if="${param.logout}" class="alert alert-success py-2">
                            <i class="bi bi-check-circle me-1"></i> Bạn đã đăng xuất thành công.
                        </div>
                        <div th:if="${param.registered}" class="alert alert-success py-2">
                            <i class="bi bi-check-circle me-1"></i> Đăng ký thành công! Vui lòng đăng nhập.
                        </div>
                        
                        <form th:action="@{/login}" method="post">
                            <div class="mb-3">
                                <label for="username" class="form-label fw-semibold">Địa chỉ Email</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="username" name="username" placeholder="name@example.com" required>
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="password" class="form-label fw-semibold">Mật khẩu</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="password" name="password" placeholder="Nhập mật khẩu..." required>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold">Đăng nhập</button>
                            </div>
                        </form>
                        <div class="mt-4 text-center border-top pt-3">
                            <p class="mb-0 text-muted">Chưa có tài khoản? <a th:href="@{/register}" class="fw-semibold text-primary">Đăng ký ngay</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/web-layout :: footer}"></footer>
</body>
</html>
