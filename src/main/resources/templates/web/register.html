<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/web-layout :: head('Đăng ký tài khoản')}"></head>
<body>
    <header th:replace="~{fragments/web-layout :: navbar}"></header>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow border-0">
                    <div class="card-header bg-dark text-white text-center py-3">
                        <h4 class="mb-0 fw-bold"><i class="bi bi-person-plus me-2"></i>Đăng ký tài khoản</h4>
                    </div>
                    <div class="card-body p-4">
                        <div th:if="${error}" class="alert alert-danger py-2">
                            <i class="bi bi-exclamation-circle me-1"></i> <span th:text="${error}"></span>
                        </div>

                        <form th:action="@{/register}" method="post" th:object="${user}">
                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-semibold">Họ và tên <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="fullName" th:field="*{fullName}" placeholder="Ví dụ: Nguyễn Văn A" required>
                            </div>
                            <div class="mb-3">
                                <label for="email" class="form-label fw-semibold">Địa chỉ Email <span class="text-danger">*</span></label>
                                <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="name@example.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label fw-semibold">Mật khẩu <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Tối thiểu 6 ký tự..." required>
                            </div>
                            <div class="mb-3">
                                <label for="phone" class="form-label fw-semibold">Số điện thoại</label>
                                <input type="tel" class="form-control" id="phone" th:field="*{phone}" placeholder="Ví dụ: 0912345678">
                            </div>
                            <div class="mb-4">
                                <label for="address" class="form-label fw-semibold">Địa chỉ</label>
                                <input type="text" class="form-control" id="address" th:field="*{address}" placeholder="Ví dụ: Hà Nội, TP.HCM...">
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg fw-semibold">Tạo tài khoản</button>
                            </div>
                        </form>
                        <div class="mt-4 text-center border-top pt-3">
                            <p class="mb-0 text-muted">Đã có tài khoản? <a th:href="@{/login}" class="fw-semibold text-primary">Đăng nhập tại đây</a></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/web-layout :: footer}"></footer>
</body>
</html>
