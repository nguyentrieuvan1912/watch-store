<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/web-layout :: head(${product.name})}"></head>
<body>
    <header th:replace="~{fragments/web-layout :: navbar}"></header>

    <main class="container my-5">
        <div th:replace="~{fragments/web-layout :: alerts}"></div>
        
        <!-- Breadcrumb -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/}">Trang chủ</a></li>
                <li class="breadcrumb-item"><a th:href="@{/products}">Sản phẩm</a></li>
                <li class="breadcrumb-item active" aria-current="page" th:text="${product.name}">Tên sản phẩm</li>
            </ol>
        </nav>

        <div class="row g-5">
            <!-- Product Image -->
            <div class="col-md-6 mb-4">
                <div class="card border-0 shadow-sm overflow-hidden p-2">
                    <img th:if="${product.image != null}" th:src="${product.image}" class="img-fluid rounded" alt="Ảnh sản phẩm" style="width: 100%; max-height: 500px; object-fit: contain;">
                    <div th:unless="${product.image != null}" class="bg-secondary text-white d-flex align-items-center justify-content-center rounded" style="height: 400px;">
                        <span>Không có hình ảnh</span>
                    </div>
                </div>
            </div>

            <!-- Product Details -->
            <div class="col-md-6">
                <div class="d-flex align-items-center gap-2 mb-2">
                    <span class="badge bg-dark" th:text="${product.brand != null ? product.brand.name : 'Chính hãng'}">Thương hiệu</span>
                    <span class="badge bg-secondary" th:text="${product.category != null ? product.category.name : 'Đồng hồ'}">Danh mục</span>
                </div>

                <h2 class="fw-bold mb-1" th:text="${product.name}">Tên sản phẩm</h2>
                <p class="text-muted mb-3">Mã model: <span class="fw-semibold" th:text="${product.model}">Mã sản phẩm</span></p>
                
                <div class="mb-3">
                    <h3 class="text-danger fw-bold display-6 mb-0" th:text="${product.price != null ? #numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' đ' : '0 đ'}">0 đ</h3>
                </div>
                
                <div class="mb-4">
                    <span th:if="${product.stock > 0}" class="badge bg-success-subtle text-success border border-success px-3 py-2 fs-6 rounded-pill">
                        <i class="bi bi-check-circle-fill me-1"></i> Còn hàng (<span th:text="${product.stock}"></span> sản phẩm có sẵn)
                    </span>
                    <span th:unless="${product.stock > 0}" class="badge bg-danger-subtle text-danger border border-danger px-3 py-2 fs-6 rounded-pill">
                        <i class="bi bi-x-circle-fill me-1"></i> Tạm hết hàng
                    </span>
                </div>
                
                <!-- Action Form (Add to Cart & Buy Now) -->
                <form th:action="@{/cart/add}" method="post" class="mb-5" th:if="${product.stock > 0}">
                    <input type="hidden" name="productId" th:value="${product.id}">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <label for="quantity" class="form-label mb-0 fw-bold">Số lượng:</label>
                        <div class="input-group" style="width: 140px;">
                            <input type="number" id="quantity" name="quantity" class="form-control text-center" value="1" min="1" th:max="${product.stock}">
                        </div>
                    </div>
                    <div class="d-flex flex-wrap gap-2">
                        <button type="button" class="btn btn-outline-primary btn-lg flex-grow-1" th:onclick="'addToCartFromDetail(' + ${product.id} + ')'">
                            <i class="bi bi-cart-plus me-1"></i> Thêm vào giỏ hàng
                        </button>
                        <button type="submit" th:formaction="@{/cart/buy-now}" class="btn btn-danger btn-lg flex-grow-1">
                            <i class="bi bi-lightning-fill me-1"></i> Mua ngay
                        </button>
                        <button type="button" 
                                class="btn btn-outline-secondary btn-lg" 
                                th:attr="data-compare-id=${product.id}"
                                th:onclick="'toggleCompareProduct(' + ${product.id} + ', this);'"
                                title="Thêm vào danh sách so sánh (tối đa 3)">
                            <i class="bi bi-arrow-left-right me-1"></i> So sánh
                        </button>
                    </div>
                </form>

                <script>
                    function addToCartFromDetail(productId) {
                        const qtyInput = document.getElementById('quantity');
                        const qty = qtyInput ? (parseInt(qtyInput.value) || 1) : 1;
                        addToCartAjax(productId, qty);
                    }
                </script>

                <div th:unless="${product.stock > 0}" class="mb-4">
                    <button type="button" 
                            class="btn btn-outline-secondary" 
                            th:attr="data-compare-id=${product.id}"
                            th:onclick="'toggleCompareProduct(' + ${product.id} + ', this);'"
                            title="Thêm vào danh sách so sánh (tối đa 3)">
                        <i class="bi bi-arrow-left-right me-1"></i> So sánh
                    </button>
                </div>
                
                <!-- Technical Specifications -->
                <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="bi bi-card-checklist me-2"></i>Thông số kỹ thuật</h5>
                <table class="table table-striped table-hover border">
                    <tbody>
                        <tr><th style="width: 40%;">Thương hiệu</th><td th:text="${product.brand != null ? product.brand.name : '-'}"></td></tr>
                        <tr><th>Danh mục</th><td th:text="${product.category != null ? product.category.name : '-'}"></td></tr>
                        <tr><th>Mã Model</th><td th:text="${product.model}"></td></tr>
                        <tr><th>Giới tính</th><td th:text="${product.gender != null ? product.gender : '-'}"></td></tr>
                        <tr><th>Loại máy</th><td th:text="${product.movement != null ? product.movement : '-'}"></td></tr>
                        <tr><th>Chất liệu vỏ</th><td th:text="${product.caseMaterial != null ? product.caseMaterial : '-'}"></td></tr>
                        <tr><th>Chất liệu dây</th><td th:text="${product.strapMaterial != null ? product.strapMaterial : '-'}"></td></tr>
                        <tr><th>Độ chống nước</th><td th:text="${product.waterResistance != null ? product.waterResistance : '-'}"></td></tr>
                        <tr><th>Bảo hành</th><td th:text="${product.warranty != null ? product.warranty : '12 tháng chính hãng'}"></td></tr>
                    </tbody>
                </table>
                
                <!-- Description -->
                <div class="mt-4">
                    <h5 class="fw-bold mb-3 border-bottom pb-2"><i class="bi bi-info-circle me-2"></i>Mô tả sản phẩm</h5>
                    <p class="text-secondary lh-base" th:text="${product.description != null and !product.description.isEmpty() ? product.description : 'Đồng hồ chính hãng được phân phối tại Watch Store với đầy đủ phụ kiện và bảo hành chính hãng.'}"></p>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/web-layout :: footer}"></footer>
</body>
</html>
