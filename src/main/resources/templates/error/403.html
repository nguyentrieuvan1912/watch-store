<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/web-layout :: head('403 - Từ chối truy cập')}"></head>
<body>
    <header th:replace="~{fragments/web-layout :: navbar}"></header>

    <main class="container my-5 py-3">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-xl-7">
                <div class="rounded-4 p-4 p-md-5 text-center text-white shadow-lg position-relative overflow-hidden"
                     style="background: linear-gradient(135deg, #0f172a 0%, #1e293b 65%, #451a03 100%); border: 1px solid rgba(217, 119, 6, 0.35);">
                    <div class="ws-blob-drift" style="top: -80px; left: -60px;"></div>
                    <div class="ws-blob-drift" style="bottom: -80px; right: -60px; animation-delay: -5s;"></div>

                    <div class="position-relative" style="z-index: 2;">
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 shadow"
                             style="width: 72px; height: 72px; background: rgba(239, 68, 68, 0.18); border: 1px solid rgba(248, 113, 113, 0.45); color: #f87171;">
                            <i class="bi bi-shield-lock-fill fs-1"></i>
                        </div>

                        <div class="fw-extrabold lh-1 mb-2"
                             style="font-size: clamp(4.5rem, 12vw, 7.5rem); background: linear-gradient(135deg, #fde68a 0%, #f59e0b 50%, #d97706 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -3px;">
                            403
                        </div>

                        <span class="badge rounded-pill px-3 py-1.5 mb-3 text-uppercase fw-bold"
                              style="background: rgba(248, 113, 113, 0.16); color: #fca5a5; border: 1px solid rgba(248, 113, 113, 0.35); letter-spacing: 1px; font-size: 0.72rem;">
                            Access Denied
                        </span>

                        <h3 class="fw-extrabold text-white mb-3">
                            Bạn không có quyền truy cập khu vực này
                        </h3>
                        <p class="text-white-50 mb-4 mx-auto" style="max-width: 500px; line-height: 1.65;">
                            Khu vực này yêu cầu đặc quyền Quản trị viên (Admin) hoặc tài khoản của bạn chưa được cấp phép. Vui lòng quay về Trang chủ hoặc đăng nhập bằng tài khoản phù hợp.
                        </p>

                        <div class="d-flex flex-wrap justify-content-center gap-3">
                            <a th:href="@{/}" class="btn ws-btn-gold btn-lg rounded-pill px-4 py-2.5 fw-bold shadow">
                                <i class="bi bi-house-door-fill me-2"></i>Quay về Trang chủ
                            </a>
                            <a th:href="@{/login}" class="btn btn-outline-light btn-lg rounded-pill px-4 py-2.5 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Đăng nhập tài khoản khác
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/web-layout :: footer}"></footer>
</body>
</html>
