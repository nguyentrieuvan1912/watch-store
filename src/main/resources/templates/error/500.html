<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/web-layout :: head('Internal Server Error')}"></head>
<body>
    <header th:replace="~{fragments/web-layout :: navbar}"></header>

    <main class="container my-5 text-center">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <h1 class="display-1 text-warning fw-bold">500</h1>
                <h2 class="mb-4">Internal Server Error</h2>
                <p class="lead mb-4" th:text="${error != null ? error : 'Something went wrong on our end. Please try again later.'}">Error message here.</p>
                <a th:href="@{/}" class="btn btn-primary btn-lg"><i class="bi bi-house-door"></i> Back to Home</a>
            </div>
        </div>
    </main>

    <footer th:replace="~{fragments/web-layout :: footer}"></footer>
</body>
</html>
