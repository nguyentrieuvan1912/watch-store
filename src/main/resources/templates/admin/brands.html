<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Brands')}"></head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/admin-layout :: sidebar}"></nav>
            
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                    <h1 class="h2">Brands</h1>
                    <button class="btn btn-sm btn-primary" data-bs-toggle="modal" data-bs-target="#addModal">
                        <i class="bi bi-plus-lg"></i> Add New Brand
                    </button>
                </div>
                
                <div th:replace="~{fragments/admin-layout :: alerts}"></div>
                
                <div class="table-responsive bg-white rounded shadow-sm">
                    <table class="table table-striped table-hover m-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="brand : ${brands}">
                                <td th:text="${brand.id}">1</td>
                                <td th:text="${brand.name}">Brand Name</td>
                                <td>
                                    <!-- Delete Form -->
                                    <form th:action="@{/admin/brands/delete/{id}(id=${brand.id})}" method="post" class="d-inline" onsubmit="return confirm('Delete this brand?');">
                                        <button type="submit" class="btn btn-sm btn-danger"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Add Modal -->
                <div class="modal fade" id="addModal" tabindex="-1">
                    <div class="modal-dialog">
                        <div class="modal-content">
                            <form th:action="@{/admin/brands/add}" method="post">
                                <div class="modal-header bg-dark text-white">
                                    <h5 class="modal-title">Add Brand</h5>
                                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                                </div>
                                <div class="modal-body">
                                    <div class="mb-3">
                                        <label for="name" class="form-label">Brand Name</label>
                                        <input type="text" class="form-control" id="name" name="name" required>
                                    </div>
                                </div>
                                <div class="modal-footer">
                                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                    <button type="submit" class="btn btn-primary">Save</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
                
            </main>
        </div>
    </div>
    
    <div th:replace="~{fragments/admin-layout :: scripts}"></div>
</body>
</html>
