<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/admin-layout :: head('Quản Lý Sản Phẩm')}"></head>
<body>
    <div class="container-fluid">
        <div class="row">
            <nav th:replace="~{fragments/admin-layout :: sidebar}"></nav>
            
            <main class="col-md-9 ms-sm-auto col-lg-10 px-md-4 py-4">
                <div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pb-2 mb-3 border-bottom">
                    <div>
                        <h1 class="h3 fw-bold text-slate">Quản Lý Sản Phẩm</h1>
                        <p class="text-muted small mb-0">Quản lý kho hàng, giá cả và danh mục đồng hồ cao cấp</p>
                    </div>
                    <a th:href="@{/admin/products/add}" class="btn btn-primary">
                        <i class="bi bi-plus-lg me-1"></i> Thêm Sản Phẩm Mới
                    </a>
                </div>
                
                <div th:replace="~{fragments/admin-layout :: alerts}"></div>
                
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th style="width: 70px;">Mã</th>
                                        <th style="width: 70px;">Ảnh</th>
                                        <th>Tên sản phẩm</th>
                                        <th>Thương hiệu / Phân loại</th>
                                        <th class="text-end">Đơn giá</th>
                                        <th class="text-center">Kho hàng</th>
                                        <th class="text-center">Trạng thái</th>
                                        <th class="text-end" style="width: 140px;">Thao tác</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <tr th:each="product : ${products}">
                                        <td class="fw-bold text-muted">#<span th:text="${product.id}">1</span></td>
                                        <td>
                                            <img th:if="${product.image != null and !#strings.isEmpty(product.image)}" 
                                                 th:src="${product.image}" alt="Product" 
                                                 style="height: 48px; width: 48px; object-fit: cover;" class="rounded border shadow-sm">
                                            <div th:unless="${product.image != null and !#strings.isEmpty(product.image)}" 
                                                 class="bg-light rounded border d-flex align-items-center justify-content-center text-muted" 
                                                 style="height: 48px; width: 48px;">
                                                <i class="bi bi-watch"></i>
                                            </div>
                                        </td>
                                        <td>
                                            <div class="fw-bold" th:text="${product.name}">Tên sản phẩm</div>
                                            <small class="text-muted">Model: <span th:text="${product.model}">Mã Model</span></small>
                                        </td>
                                        <td>
                                            <span class="badge bg-light text-dark border me-1" 
                                                  th:text="${product.brand != null ? product.brand.name : 'Chưa phân hãng'}"></span>
                                            <small class="text-muted d-block mt-1" 
                                                   th:text="${product.category != null ? product.category.name : ''}"></small>
                                        </td>
                                        <td class="text-end fw-bold text-primary" 
                                            th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' đ'}">
                                            0 đ
                                        </td>
                                        <td class="text-center">
                                            <span th:if="${product.stock > 5}" class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1" th:text="${product.stock + ' sp'}"></span>
                                            <span th:if="${product.stock <= 5 and product.stock > 0}" class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1" th:text="'Sắp hết (' + ${product.stock} + ')'"></span>
                                            <span th:if="${product.stock == 0}" class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1">Hết hàng</span>
                                        </td>
                                        <td class="text-center">
                                            <span class="badge bg-success" th:if="${product.status}">Đang bán</span>
                                            <span class="badge bg-secondary" th:unless="${product.status}">Ngừng bán</span>
                                        </td>
                                        <td class="text-end">
                                            <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-primary me-1" title="Chỉnh sửa">
                                                <i class="bi bi-pencil"></i>
                                            </a>
                                            <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post" class="d-inline" 
                                                  onsubmit="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?');">
                                                <button type="submit" class="btn btn-sm btn-outline-danger" title="Xóa">
                                                    <i class="bi bi-trash"></i>
                                                </button>
                                            </form>
                                        </td>
                                    </tr>
                                    <tr th:if="${#lists.isEmpty(products)}">
                                        <td colspan="8" class="text-center py-4 text-muted">
                                            Chưa có sản phẩm nào trong kho dữ liệu.
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    
    <div th:replace="~{fragments/admin-layout :: scripts}"></div>
</body>
</html>
