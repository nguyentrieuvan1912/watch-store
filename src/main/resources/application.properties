spring.config.import=optional:file:.env[.properties]

spring.application.name=watch-store
spring.devtools.restart.enabled=false

server.port=${PORT:8081}

# Database Configuration (Railway / Docker Environment Variables with Localhost Fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mariadb://localhost:3306/watch_store?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sapassword}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Spring AI Configuration (Google Gemini via OpenAI Compatible Endpoint)
spring.ai.openai.api-key=${GCP_API_KEY:${GEMINI_API_KEY:dummy-key}}
spring.ai.google.genai.api-key=${GEMINI_API_KEY:${GCP_API_KEY:}}
spring.ai.openai.base-url=${SPRING_AI_OPENAI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai/}
spring.ai.openai.chat.options.model=${GEMINI_CHAT_MODEL:gemini-3.5-flash-lite}

# Google OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:${GOOGLE_CLIENT_ID:disabled-google-client-id}}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:${GOOGLE_CLIENT_SECRET:disabled-google-client-secret}}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# MariaDB Vector Store Configuration
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration,org.springframework.ai.autoconfigure.chat.client.ChatClientAutoConfiguration
spring.ai.vectorstore.mariadb.initialize-schema=true
spring.ai.vectorstore.mariadb.table-name=vector_store
spring.ai.vectorstore.mariadb.dimensions=768